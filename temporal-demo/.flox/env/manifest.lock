  "compose": {
    "composer": {
      "schema-version": "1.17.0",
      "description": "# Temporal\n\nStart Temporal + worker in the background:\n\n```bash\nflox services start\nflox activate --start-services\n```\n\nSend a hello workflow:\n\n```bash\ngo run ./start YourName\n```\n",
      "install": {
        "agent-plugin-temporal-developer": {
          "pkg-path": "agent-stacks/agent-plugin-temporalio-skill-temporal-developer",
          "pkg-group": "agent-plugin-temporal-developer"
        },
        "flox-agent": {
          "pkg-path": "flox/flox-agent",
          "pkg-group": "flox-agent"
        },
        "gcc": {
          "pkg-path": "gcc",
          "pkg-group": "go"
        },
        "go": {
          "pkg-path": "go",
          "pkg-group": "go"
        },
        "gum": {
          "pkg-path": "gum",
          "pkg-group": "demo-tools"
        },
        "jq": {
          "pkg-path": "jq",
          "pkg-group": "demo-tools"
        }
      },
      "hook": {
        "on-activate": "# Point Go's caches at a writable location.\n# Default GOPATH is $HOME/go, which fails inside the\n# CI test namespace where HOME=/var/empty (read-only).\nexport GOPATH=\"$FLOX_ENV_CACHE/go\"\nexport GOMODCACHE=\"$GOPATH/pkg/mod\"\nexport GOCACHE=\"$FLOX_ENV_CACHE/go-build\"\nmkdir -p \"$GOPATH\" \"$GOCACHE\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    'Temporal Web UI:' \\\n    \"  http://$TEMPORAL_HOST:$TEMPORAL_UI_PORT\"\nfi\n"
      },
      "options": {
        "systems": [
          "aarch64-darwin",
          "aarch64-linux",
          "x86_64-linux"
        ]
      },
      "services": {
        "worker": {
          "command": "  cd \"$FLOX_ENV_PROJECT\"\n  export GOPATH=\"$FLOX_ENV_CACHE/go\"\n  export GOMODCACHE=\"$GOPATH/pkg/mod\"\n  export GOCACHE=\"$FLOX_ENV_CACHE/go-build\"\n  mkdir -p \"$GOPATH\" \"$GOCACHE\"\n  until temporal workflow list \\\n      --address \"$TEMPORAL_HOST:$TEMPORAL_PORT\" \\\n      >/dev/null 2>&1; do\n    sleep 1\n  done\n  exec go run ./worker\n"
        }
      },
      "include": {
        "environments": [
          {
            "dir": "../temporal"
          }
        ]
      }
    },
    "include": [
      {
        "manifest": {
          "schema-version": "1.17.0",
          "description": "Temporal development server with SQLite storage and a web UI.\n",
          "install": {
            "temporal": {
              "pkg-path": "temporal",
              "pkg-group": "temporal"
            },
            "temporal-cli": {
              "pkg-path": "temporal-cli",
              "pkg-group": "temporal"
            }
          },
          "vars": {
            "TEMPORAL_HOST": "127.0.0.1",
            "TEMPORAL_PORT": "7233",
            "TEMPORAL_UI_PORT": "8233"
          },
          "hook": {
            "on-activate": "export TEMPORAL_DATA=\"$FLOX_ENV_CACHE/temporal\"\n\nif [ ! -d \"$TEMPORAL_DATA\" ]; then\n  mkdir -p \"$TEMPORAL_DATA\"\nfi\n"
          },
          "options": {
            "systems": [
              "aarch64-darwin",
              "aarch64-linux",
              "x86_64-linux"
            ]
          },
          "services": {
            "temporal": {
              "command": "  TEMPORAL_DATA=\"$FLOX_ENV_CACHE/temporal\"\n  mkdir -p \"$TEMPORAL_DATA\"\n  exec temporal server start-dev \\\n    --ip \"$TEMPORAL_HOST\" \\\n    --port \"$TEMPORAL_PORT\" \\\n    --ui-port \"$TEMPORAL_UI_PORT\" \\\n    --db-filename \"$TEMPORAL_DATA/temporal.db\"\n"
            }
          }
        },
        "name": "temporal",
        "descriptor": {
          "dir": "../temporal"
        }
      }
    ],
    "warnings": [
      {
        "warning": {
          "Overriding": [
            "options",
            "systems"
          ]
        },
        "higher_priority_name": "Current manifest"
      }
    ]
  }
