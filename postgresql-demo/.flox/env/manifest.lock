        "doc": "/nix/store/niib1wi0nvc0k5dsd3rwbhj62i4cj05r-postgresql-18.6-doc",
        "jit": "/nix/store/kcfygy3lywrmxw3asy27k20f6dcgjvaj-postgresql-18.6-jit",
        "lib": "/nix/store/yi1sv4ygaaf0h02imxlh4061ccigjp2w-postgresql-18.6-lib",
        "man": "/nix/store/r52y4h64z9lcraqkf5hrfccwl3gf1zzz-postgresql-18.6-man",
        "out": "/nix/store/4nz2y9q8kdn78axpm4jd7c1phmiygg58-postgresql-18.6",
        "plperl": "/nix/store/v2airyn1v1ha18iqpz3i0fqwz6clb7k9-postgresql-18.6-plperl",
        "plpython3": "/nix/store/n559p4bvrlavllj74c3qxka3a50l9lfh-postgresql-18.6-plpython3",
        "pltcl": "/nix/store/jlz7qb5qi37adgn3v2bparp4yxv54ssq-postgresql-18.6-pltcl"
      },
      "system": "x86_64-linux",
      "group": "postgresql",
      "priority": 5
    }
  ],
  "compose": {
    "composer": {
      "schema-version": "1.17.0",
      "description": "# PostgreSQL\n\nStart PostgreSQL in the background:\n\n```bash\nflox services start\nflox activate --start-services\n```\n\nConnect to PostgreSQL:\n\n```bash\npsql\n```\n\nAdd extensions (use the postgresql pkg-group):\n\n```bash\nflox search postgresqlPackages\nflox install postgresqlPackages.postgis -g postgresql\n```\n",
      "install": {
        "curl": {
          "pkg-path": "curl",
          "pkg-group": "demo-tools"
        },
        "gum": {
          "pkg-path": "gum",
          "pkg-group": "demo-tools"
        },
        "pgvector": {
          "pkg-path": "postgresqlPackages.pgvector",
          "pkg-group": "postgresql"
        }
      },
      "vars": {
        "PGPORT": "15432"
      },
      "hook": {
        "on-activate": "\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' --padding '1 4' \\\n    'Connection information:' \\\n    \"  listen_addresses=$PGHOSTADDR\" \\\n    \"  port=$PGPORT\" \\\n    \"  user=$PGUSER\" \\\n    \"  database=$PGDATABASE\" \\\n    \"  DATABASE_URL=$DATABASE_URL\"\nfi\n"
      },
      "options": {
        "systems": [
          "aarch64-darwin",
          "aarch64-linux",
          "x86_64-linux"
        ]
      },
      "include": {
        "environments": [
          {
            "dir": "../postgresql"
          }
        ]
      }
    },
    "include": [
      {
        "manifest": {
          "schema-version": "1.17.0",
          "description": "PostgreSQL database server and client for local development.\n",
          "install": {
            "postgresql": {
              "pkg-path": "postgresql",
              "pkg-group": "postgresql",
              "outputs": "all"
            }
          },
          "vars": {
            "PGDATABASE": "pgdb",
            "PGHOSTADDR": "127.0.0.1",
            "PGPASS": "pgpass",
            "PGUSER": "pguser"
          },
          "hook": {
            "on-activate": "export PGDIR=\"$FLOX_ENV_CACHE/postgres\"\nexport PGDATA=\"$PGDIR/data\"\n\n# Socket dir must be short to stay under the 103-byte\n# unix socket path limit. Use a hash of $PGDIR to keep\n# it unique per environment.\nSOCKETDIR=\"/tmp/flox-pg-$(echo \"$PGDIR\" | cksum | cut -d' ' -f1)\"\n\nif [[ ! -d \"$SOCKETDIR\" ]]; then\n  mkdir -p \"$SOCKETDIR\"\nfi\n\nif [[ -n \"${PGPORT:-}\" ]]; then\n  # TCP mode: PGPORT is set, clients connect via host:port\n  export PGHOST=\"$PGHOSTADDR\"\n  export DATABASE_URL=\"postgresql://$PGUSER:$PGPASS@$PGHOSTADDR:$PGPORT/$PGDATABASE\"\n  PG_LISTEN_FLAGS=\"-c listen_addresses=$PGHOSTADDR -p $PGPORT\"\nelse\n  # Socket mode: no PGPORT, clients connect via unix socket\n  unset PGHOSTADDR\n  export PGHOST=\"$SOCKETDIR\"\n  export DATABASE_URL=\"postgresql:///$PGDATABASE?host=$SOCKETDIR\"\n  PG_LISTEN_FLAGS=\"\"\nfi\n\nINIT_LOG=\"$PGDIR/init.log\"\n\npg_init_fail() {\n  echo \"ERROR: PostgreSQL initialization failed.\" >&2\n  if [ -f \"$INIT_LOG\" ]; then\n    echo \"--- init.log ---\" >&2\n    cat \"$INIT_LOG\" >&2\n    echo \"--- end init.log ---\" >&2\n  fi\n  exit 1\n}\n\nif [[ ! -d \"$PGDATA\" ]]; then\n  mkdir -p \"$PGDATA\"\n  initdb \"$PGDATA\" \\\n    --locale=C \\\n    --encoding=UTF8 \\\n    --auth=trust \\\n    --username \"$PGUSER\" \\\n    >> \"$INIT_LOG\" 2>&1 \\\n    || pg_init_fail\nfi\n\npg_ctl -D \"$PGDATA\" -w start \\\n  -o \"-c unix_socket_directories=$SOCKETDIR $PG_LISTEN_FLAGS\" \\\n  >> \"$INIT_LOG\" 2>&1 \\\n  || pg_init_fail\nif psql -lqt | cut -d \\| -f 1 | grep -qw \"$PGDATABASE\"; then\n  true\nelse\n  createdb >> \"$INIT_LOG\" 2>&1 || pg_init_fail\nfi\npg_ctl -D \"$PGDATA\" -m fast -w stop >> \"$INIT_LOG\" 2>&1\nrm -f \"$INIT_LOG\"\n"
          },
          "options": {
            "systems": [
              "aarch64-darwin",
              "aarch64-linux",
              "x86_64-linux"
            ]
          },
          "services": {
            "postgres": {
              "command": "  PGDATA=\"$FLOX_ENV_CACHE/postgres/data\"\n  SOCKETDIR=\"/tmp/flox-pg-$(echo \"$FLOX_ENV_CACHE/postgres\" | cksum | cut -d' ' -f1)\"\n  mkdir -p \"$SOCKETDIR\"\n  if [[ -n \"${PGPORT:-}\" ]]; then\n    exec postgres -D \"$PGDATA\" -c unix_socket_directories=\"$SOCKETDIR\" -c listen_addresses=\"$PGHOSTADDR\" -p \"$PGPORT\"\n  else\n    exec postgres -D \"$PGDATA\" -c unix_socket_directories=\"$SOCKETDIR\" -c listen_addresses=\"\"\n  fi\n"
            }
          }
        },
        "name": "postgresql",
        "descriptor": {
          "dir": "../postgresql"
        }
      }
    ],
    "warnings": [
      {
        "warning": {
          "Overriding": [
            "options",
            "systems"
          ]
        },
        "higher_priority_name": "Current manifest"
      }
    ]
  }
}
