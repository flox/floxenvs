{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "Persistent memory for coding agents with a REST and MCP backend.\n",
    "install": {
      "agent-plugin-agentmemory": {
        "pkg-path": "agent-stacks/agent-plugin-agentmemory",
        "pkg-group": "agent-plugin-agentmemory"
      },
      "claude-code": {
        "pkg-path": "flox/claude-code",
        "pkg-group": "claude-code"
      },
      "flox-agent": {
        "pkg-path": "flox/flox-agent",
        "pkg-group": "flox-agent"
      },
      "iii": {
        "pkg-path": "flox/iii",
        "pkg-group": "iii"
      },
      "nodejs": {
        "pkg-path": "nodejs_20",
        "pkg-group": "agentmemory"
      }
    },
    "vars": {
      "AGENTMEMORY_INJECT_CONTEXT": "true",
      "AGENTMEMORY_URL": "http://localhost:3111",
      "AGENTMEMORY_VERSION": "0.9.30"
    },
    "hook": {
      "on-activate": "export AGENTMEMORY_CACHE=\"$FLOX_ENV_CACHE/agentmemory\"\nexport npm_config_cache=\"$AGENTMEMORY_CACHE/npm\"\nmkdir -p \"$npm_config_cache\"\n\n# Hand Claude Code the local backend's API secret. The plugin's\n# hooks and MCP bridge send AGENTMEMORY_SECRET to whatever\n# AGENTMEMORY_URL is, so only do this for a loopback URL; a\n# remote server needs its own AGENTMEMORY_SECRET in [vars]. The\n# secret lives where upstream keeps it, ~/.agentmemory/secret:\n# every project's Claude Code talks to whichever backend holds\n# the port, so they all need the same one.\n#\n# \"Loopback\" is upstream's isLoopbackUrl, done the same way: parse\n# the URL, lowercase the host, and accept only localhost, ::1 or a\n# dotted-quad 127.x.x.x. A shell glob on the text would also accept\n# hosts like 127.0.0.1.nip.io, or http://127.0.0.1@example.com\n# (whose host is example.com), and send them the local secret.\nagentmemory_local=\"$(node -e '\n  let h;\n  try { h = new URL(process.argv[1]).hostname.toLowerCase(); } catch { process.exit(0); }\n  h = h.replace(/^\\[|\\]$/g, \"\");\n  if (h === \"localhost\" || h === \"::1\" || /^127(?:\\.\\d{1,3}){3}$/.test(h)) process.stdout.write(\"1\");\n' \"$AGENTMEMORY_URL\" 2>/dev/null)\"\nif [ -n \"$agentmemory_local\" ] && [ -z \"${AGENTMEMORY_SECRET:-}\" ]; then\n  secret_file=\"$HOME/.agentmemory/secret\"\n  if [ ! -s \"$secret_file\" ] \\\n    && ! { (umask 077; mkdir -p \"$HOME/.agentmemory\") 2>/dev/null \\\n      && [ -w \"$HOME/.agentmemory\" ]; }; then\n    # HOME isn't writable (CI builders, some containers), so keep\n    # this env's secret in its own cache instead.\n    secret_file=\"$AGENTMEMORY_CACHE/secret\"\n  fi\n  if [ ! -s \"$secret_file\" ]; then\n    # Write a temp file and hard-link it into place, as upstream's\n    # ensureServerSecret does, so concurrent activations settle on\n    # one secret and nothing ever reads a half-written file.\n    (\n      umask 077\n      mkdir -p \"$(dirname \"$secret_file\")\" 2>/dev/null || exit 0\n      [ -e \"$secret_file\" ] && [ ! -s \"$secret_file\" ] && rm -f \"$secret_file\"\n      tmp=\"$secret_file.$$.tmp\"\n      node -e 'process.stdout.write(require(\"crypto\").randomBytes(32).toString(\"hex\") + \"\\n\")' \\\n        > \"$tmp\" 2>/dev/null && [ -s \"$tmp\" ] && ln \"$tmp\" \"$secret_file\" 2>/dev/null\n      rm -f \"$tmp\"\n    )\n  fi\n  if [ -s \"$secret_file\" ]; then\n    AGENTMEMORY_SECRET=\"$(cat \"$secret_file\")\"\n    export AGENTMEMORY_SECRET\n  fi\nfi\nunset agentmemory_local secret_file\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "agentmemory": {
        "command": "export AGENTMEMORY_CACHE=\"$FLOX_ENV_CACHE/agentmemory\"\nexport npm_config_cache=\"$AGENTMEMORY_CACHE/npm\"\n# nixpkgs runs npm under nodejs-slim, whose store path has no\n# lib/, so npm's default global prefix is unusable and npx\n# fails with ENOENT. Give npm a writable prefix of its own,\n# set here rather than in the hook so it doesn't override\n# the global prefix of environments that include this one.\nexport npm_config_prefix=\"$AGENTMEMORY_CACHE/npm-prefix\"\nexport npm_config_userconfig=\"${npm_config_userconfig:-$HOME/.npmrc}\"\n# The CLI keeps its engine state, pidfiles and preferences\n# under $HOME/.agentmemory. Point HOME into the env cache so\n# each environment has its own, and so the service works\n# where HOME isn't writable. The API secret comes from\n# AGENTMEMORY_SECRET, which the hook exports.\nreal_home=\"$HOME\"\nexport HOME=\"$AGENTMEMORY_CACHE/home\"\nexport AGENTMEMORY_DATA_DIR=\"$AGENTMEMORY_CACHE/data\"\n# The CLI skips its onboarding, global-install and\n# engine-install prompts when CI is set, even if the\n# service is attached to a terminal.\nexport CI=1\nmkdir -p \"$npm_config_cache\" \"$npm_config_prefix/lib\" \"$HOME\" \"$AGENTMEMORY_DATA_DIR\"\n# Transcript import and CLAUDE_MEMORY_BRIDGE use ~/.claude;\n# keep them on the real one.\nif [ -d \"$real_home/.claude\" ] && [ ! -e \"$HOME/.claude\" ]; then\n  ln -s \"$real_home/.claude\" \"$HOME/.claude\"\nfi\n# Serve on AGENTMEMORY_URL's port so the server and its\n# clients agree; the CLI derives its other ports from it.\nport=\"$(printf '%s' \"$AGENTMEMORY_URL\" | sed -nE 's#^[a-zA-Z]+://[^/]*:([0-9]+)(/.*)?$#\\1#p')\"\nexec npx -y \"@agentmemory/agentmemory@$AGENTMEMORY_VERSION\" --port \"${port:-3111}\"\n",
        "shutdown": {
          "command": "export AGENTMEMORY_CACHE=\"$FLOX_ENV_CACHE/agentmemory\"\nexport npm_config_cache=\"$AGENTMEMORY_CACHE/npm\"\nexport npm_config_prefix=\"$AGENTMEMORY_CACHE/npm-prefix\"\nexport npm_config_userconfig=\"${npm_config_userconfig:-$HOME/.npmrc}\"\nexport HOME=\"$AGENTMEMORY_CACHE/home\"\nexport CI=1\nmkdir -p \"$npm_config_cache\" \"$npm_config_prefix/lib\" \"$HOME\"\nport=\"$(printf '%s' \"$AGENTMEMORY_URL\" | sed -nE 's#^[a-zA-Z]+://[^/]*:([0-9]+)(/.*)?$#\\1#p')\"\nexec npx -y --prefer-offline \"@agentmemory/agentmemory@$AGENTMEMORY_VERSION\" stop --port \"${port:-3111}\"\n",
          "timeout-seconds": 30
        }
      }
    }
  },
