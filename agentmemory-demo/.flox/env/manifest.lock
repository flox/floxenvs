{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# agentmemory — persistent memory for Claude Code\n\nStart the backend in the background:\n\n```bash\nflox services start\nflox activate --start-services\n```\n\nPlugin:\n\n```text\n$FLOX_ENV/share/agent-plugins/agentmemory\n```\n\nTry it:\n\n```bash\nflox-agent launch claude  # then /recall, /remember, /handoff\n```\n",
    "install": {
      "agent-plugin-agentmemory": {
        "pkg-path": "agent-stacks/agent-plugin-agentmemory",
        "pkg-group": "agent-plugin-agentmemory"
      },
      "claude-code": {
        "pkg-path": "flox/claude-code",
        "pkg-group": "claude-code"
      },
      "flox-agent": {
        "pkg-path": "flox/flox-agent",
        "pkg-group": "flox-agent"
      },
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "nodejs": {
        "pkg-path": "nodejs_20",
        "pkg-group": "agentmemory"
      }
    },
    "vars": {
      "AGENTMEMORY_INJECT_CONTEXT": "true",
      "AGENTMEMORY_URL": "http://localhost:3111",
      "AGENTMEMORY_VERSION": "0.9.30"
    },
    "hook": {
      "on-activate": "export AGENTMEMORY_CACHE=\"$FLOX_ENV_CACHE/agentmemory\"\nexport npm_config_cache=\"$AGENTMEMORY_CACHE/npm\"\nmkdir -p \"$npm_config_cache\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    'REST + MCP:' \\\n    \"  $AGENTMEMORY_URL\" \\\n    '' \\\n    'Pinned server version:' \\\n    \"  $AGENTMEMORY_VERSION\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "agentmemory": {
        "command": "export AGENTMEMORY_CACHE=\"$FLOX_ENV_CACHE/agentmemory\"\nexport npm_config_cache=\"$AGENTMEMORY_CACHE/npm\"\nexport XDG_DATA_HOME=\"$AGENTMEMORY_CACHE/data\"\nmkdir -p \"$npm_config_cache\" \"$XDG_DATA_HOME\"\nexec npx -y \"@agentmemory/agentmemory@$AGENTMEMORY_VERSION\"\n"
      }
    }
  },
