{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "LM Studio tools for running and serving local language models.\n",
    "install": {
      "curl": {
        "pkg-path": "curl",
        "pkg-group": "lmstudio"
      },
      "flox-agent": {
        "pkg-path": "flox/flox-agent",
        "pkg-group": "flox-agent"
      },
      "jq": {
        "pkg-path": "jq",
        "pkg-group": "lmstudio"
      },
      "lmstudio": {
        "pkg-path": "flox/lmstudio",
        "pkg-group": "lmstudio"
      }
    },
    "vars": {
      "LMS_CONTEXT_LENGTH": "131072",
      "LMS_HOST": "127.0.0.1",
      "LMS_PORT": "11234"
    },
    "hook": {
      "on-activate": "export LMS_LOG_DIR=\"$FLOX_ENV_CACHE/lmstudio/logs\"\nmkdir -p \"$LMS_LOG_DIR\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "lmstudio": {
        "command": "export LMS_LOG_DIR=\"${LMS_LOG_DIR:-$FLOX_ENV_CACHE/lmstudio/logs}\"\nmkdir -p \"$LMS_LOG_DIR\"\nexec lms-service\n"
      }
    }
  },
