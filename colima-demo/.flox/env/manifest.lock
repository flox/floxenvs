    "schema-version": "1.10.0",
    "install": {
      "colima": {
        "pkg-path": "colima"
      },
      "ctop": {
        "pkg-path": "ctop",
        "pkg-group": "demo-tools"
      },
      "dive": {
        "pkg-path": "dive",
        "pkg-group": "demo-tools"
      },
      "docker": {
        "pkg-path": "docker-client"
      },
      "docker-compose": {
