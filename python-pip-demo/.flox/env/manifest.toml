schema-version = "1.17.0"

description = '''
# Python + pip

pip commands:

```text
pip install <package>
pip install -r requirements.txt
pip list
```
'''

[include]
environments = [
  { dir = "../python-pip" }
]

# gum is a demo-only tool for styled terminal output.

[install]
gum.pkg-path = "gum"
gum.pkg-group = "demo-tools"

[hook]
on-activate = '''
if [[ "${FLOX_ENVS_TESTING:-}" != "1" ]]; then
  gum style --border double --margin '1 2' \
    --padding '1 4' \
    'Python + pip environment ready!' '' \
    'Python version:' \
    "  $(python3 --version 2>&1)"
fi
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
