{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Remotion + Claude Code\n\nScaffold a new video project:\n\n```text\nnpx create-video@latest --yes --blank --no-tailwind my-video\n```\n\nInside a Remotion project:\n\n```text\nnpx remotion studio       Open the visual editor\nnpx remotion render       Render to MP4\nnpx remotion ffmpeg ...   Bundled ffmpeg\n```\n\nAsk Claude (skill auto-loads on Remotion code):\n\n```text\nclaude\n```\n",
    "install": {
      "claude-code": {
        "pkg-path": "flox/claude-code",
        "pkg-group": "claude-code"
      },
      "flox-ai": {
        "pkg-path": "flox/flox-ai",
        "pkg-group": "flox-ai"
      },
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "nodejs": {
        "pkg-path": "nodejs_22",
        "pkg-group": "remotion"
      },
      "skills-remotion": {
        "pkg-path": "flox/skills-remotion",
        "pkg-group": "skills-remotion"
      }
    },
    "hook": {
      "on-activate": "eval \"$(flox-ai setup-hook)\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    \"Node: $(node --version)\"\nfi\n"
    },
    "profile": {
      "bash": "eval \"$(flox-ai setup-profile-bash)\"\n",
      "zsh": "eval \"$(flox-ai setup-profile-zsh)\"\n",
      "fish": "flox-ai setup-profile-fish | source\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
