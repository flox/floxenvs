  "manifest": {
    "schema-version": "1.17.0",
    "description": "# fnox demo\nFort Knox for your secrets\n\n```bash\n  fnox list                   # view configured secrets\n  fnox get DATABASE_URL       # decrypt one secret\n  fnox exec -- env | grep ^DEMO_\n  fnox lease create greeting  # run command lease\n  fnox tui                    # interactive dashboard\n```\n",
    "install": {
      "age": {
        "pkg-path": "age",
        "pkg-group": "demo-tools"
      },
      "fnox": {
        "pkg-path": "flox/fnox",
        "pkg-group": "fnox"
      }
    },
    "vars": {
      "FNOX_LOG": "warn"
    },
    "hook": {
      "on-activate": "# Per-environment data path; used by fnox to cache lease state,\n# session tokens, and resolved secrets.\nexport FNOX_DATA_DIR=\"$FLOX_ENV_CACHE/fnox\"\nmkdir -p \"$FNOX_DATA_DIR\"\n\n# Use the demo identity that's checked into the repo. This is a\n# *demo-only* key — never reuse it for real secrets.\nexport FNOX_AGE_KEY=\"$(grep '^AGE-SECRET-KEY-' \\\n  \"$FLOX_ENV_PROJECT/fnox-demo-key.txt\")\"\n\n# Per-cwd config (fnox auto-discovers fnox.toml).\nexport FNOX_CONFIG_DIR=\"$FLOX_ENV_PROJECT\"\n\nif [ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]; then\n  echo \"  Try one of these (cwd: $FLOX_ENV_PROJECT):\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
