schema-version = "1.17.0"

description = '''
# fnox demo
Fort Knox for your secrets

```text
  fnox list                  — view configured secrets
  fnox get DATABASE_URL      — decrypt one secret
  fnox exec -- env | grep ^DEMO_
  fnox lease create greeting — run command lease
  fnox tui                   — interactive dashboard
```
'''

[include]
environments = [{ dir = "../fnox" }]

[install]
age.pkg-path = "age"
age.pkg-group = "demo-tools"

[hook]
on-activate = '''
# Use the demo identity that's checked into the repo. This is a
# *demo-only* key — never reuse it for real secrets.
export FNOX_AGE_KEY="$(grep '^AGE-SECRET-KEY-' \
  "$FLOX_ENV_PROJECT/fnox-demo-key.txt")"

# Per-cwd config (fnox auto-discovers fnox.toml).
export FNOX_CONFIG_DIR="$FLOX_ENV_PROJECT"

if [ "${FLOX_ENVS_TESTING:-}" != "1" ]; then
  echo "  Try one of these (cwd: $FLOX_ENV_PROJECT):"
fi
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
