    "schema-version": "1.17.0",
    "description": "# Deno\n\nCommands:\n\n```bash\ndeno install  # Install packages\ndeno run      # Run a script\ndeno task     # Run a task\n```\n",
    "install": {
      "deno": {
        "pkg-path": "deno",
        "pkg-group": "javascript-deno"
      },
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      }
    },
    "vars": {
      "DENO_AUTO_INSTALL": "true",
      "NODE_ENV": "development"
    },
    "hook": {
      "on-activate": "export DENO_CACHE=\"$FLOX_ENV_CACHE/javascript-deno\"\nmkdir -p \"$DENO_CACHE\"\n\nif [ \"$DENO_AUTO_INSTALL\" = \"true\" ] \\\n    && [ -f deno.json ] \\\n    && [ -f deno.lock ]; then\n  HASH=$(cat deno.json deno.lock \\\n    | sha256sum | cut -d\" \" -f1)\n  LAST=$(cat \"$DENO_CACHE/packages-hash\" 2>/dev/null)\n  if [ \"$HASH\" != \"$LAST\" ]; then\n    deno install\n    echo \"$HASH\" > \"$DENO_CACHE/packages-hash\"\n  fi\nfi\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    'Deno environment ready!' '' \\\n    'Deno version:' \\\n    \"  $(deno --version | head -1)\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
