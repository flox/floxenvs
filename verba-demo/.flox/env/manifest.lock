          },
          "profile": {
            "common": "source \"$PYTHON_DIR/bin/activate\"\n"
          },
          "options": {
            "systems": [
              "aarch64-darwin",
              "aarch64-linux",
              "x86_64-linux"
            ]
          },
          "services": {
