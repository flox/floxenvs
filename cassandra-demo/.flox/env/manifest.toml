schema-version = "1.17.0"

description = '''
# Cassandra

Start Cassandra in the background:

```text
flox services start
flox activate --start-services
```
'''

[include]
environments = [
  { dir = "../cassandra" }
]

# gum is a demo-only tool for styled terminal output.

[install]
gum.pkg-path = "gum"
gum.pkg-group = "demo-tools"

[hook]
on-activate = '''
if [[ "${FLOX_ENVS_TESTING:-}" != "1" ]]; then
  gum style --border double --margin '1 2' \
    --padding '1 4' \
    'Connect to Cassandra:' \
    "  cqlsh $CASSANDRA_HOST $CASSANDRA_PORT" \
    '' \
    'Connection information:' \
    "  host=$CASSANDRA_HOST" \
    "  port=$CASSANDRA_PORT" \
    "  cluster=$CASSANDRA_CLUSTER_NAME"
fi
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
