[project]
name = "honcho-flox"
version = "0.0.0"
description = "Flox wrapper to lock honcho server + honcho-ai SDK"
requires-python = ">=3.13"
dependencies = [
  "honcho",
  "honcho-ai",
  # honcho 3.2.2 imports src.dreamer.surprisal unconditionally from
  # src.dreamer.__init__, and that module imports numpy at the top
  # level. Upstream only pulls numpy in through the optional
  # `surprisal` extra (via scikit-learn), so `import src.main` fails
  # with ModuleNotFoundError without it. Add numpy on its own — the
  # scikit-learn imports under src/dreamer/trees/ are all lazy, so the
  # heavy extra stays out of the closure.
  "numpy",
]

[tool.uv.sources]
honcho = { git = "https://github.com/plastic-labs/honcho.git", tag = "v3.2.2" }
honcho-ai = { git = "https://github.com/plastic-labs/honcho.git", tag = "v3.2.2", subdirectory = "sdks/python" }
