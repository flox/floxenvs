  "manifest": {
    "schema-version": "1.17.0",
    "description": "Podman and Podman Compose for running rootless containers.\n",
    "install": {
      "podman": {
        "pkg-path": "podman",
        "pkg-group": "podman"
      },
      "podman-compose": {
        "pkg-path": "podman-compose",
        "pkg-group": "podman"
      },
      "qemu": {
        "pkg-path": "qemu",
        "pkg-group": "podman",
        "systems": [
          "aarch64-darwin"
        ]
      }
    },
    "hook": {
      "on-activate": "# Ensure containers policy exists on Linux\nif [ \"$(uname -s)\" = \"Linux\" ]; then\n  POLICY=\"$HOME/.config/containers/policy.json\"\n  if [ ! -f \"$POLICY\" ]; then\n    mkdir -p \"$(dirname \"$POLICY\")\"\n    printf '%s\\n' \\\n      '{\"default\": [{\"type\": \"insecureAcceptAnything\"}]}' \\\n      > \"$POLICY\"\n  fi\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
