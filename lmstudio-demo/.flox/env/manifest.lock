{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# LM Studio — local LLMs + OpenAI-compatible API\n\nStart the API server:\n\n```bash\nflox services start\n```\n\nHealth check:  lmstudio-health\n\nDownload + run a model:\n\n```bash\nlms get qwen2.5-7b-instruct\nlms load qwen2.5-7b-instruct\n```\n\nLaunch an agentic CLI against the local model:\n\n```bash\nlms-launch claude --model qwen2.5-7b-instruct\nlms-launch codex  --model qwen2.5-7b-instruct\n```\n",
    "install": {
      "curl": {
        "pkg-path": "curl",
        "pkg-group": "lmstudio"
      },
      "flox-agent": {
        "pkg-path": "flox/flox-agent",
        "pkg-group": "flox-agent"
      },
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "jq": {
        "pkg-path": "jq",
        "pkg-group": "lmstudio"
      },
      "lmstudio": {
        "pkg-path": "flox/lmstudio",
        "pkg-group": "lmstudio"
      }
    },
    "vars": {
      "LMS_CONTEXT_LENGTH": "131072",
      "LMS_HOST": "127.0.0.1",
      "LMS_PORT": "11234"
    },
    "hook": {
      "on-activate": "export LMS_LOG_DIR=\"$FLOX_ENV_CACHE/lmstudio/logs\"\nmkdir -p \"$LMS_LOG_DIR\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' --padding '1 4' \\\n    \"API: http://${LMS_HOST}:${LMS_PORT}/v1\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "lmstudio": {
        "command": "export LMS_LOG_DIR=\"${LMS_LOG_DIR:-$FLOX_ENV_CACHE/lmstudio/logs}\"\nmkdir -p \"$LMS_LOG_DIR\"\nexec lms-service\n"
      }
    }
  },
