{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "Valkey server and CLI for a Redis-compatible key-value store.\n",
    "install": {
      "valkey": {
        "pkg-path": "valkey",
        "pkg-group": "valkey"
      }
    },
    "vars": {
      "VALKEY_HOST": "127.0.0.1",
      "VALKEY_PORT": "16380"
    },
    "hook": {
      "on-activate": "export VALKEY_DATA=\"$FLOX_ENV_CACHE/valkey\"\n\nif [ ! -d \"$VALKEY_DATA\" ]; then\n  mkdir -p \"$VALKEY_DATA\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "valkey": {
        "command": "  VALKEY_DATA=\"$FLOX_ENV_CACHE/valkey\"\n  mkdir -p \"$VALKEY_DATA\"\n  exec valkey-server \\\n    --bind \"$VALKEY_HOST\" \\\n    --port \"$VALKEY_PORT\" \\\n    --dir \"$VALKEY_DATA\" \\\n    --daemonize no\n"
      }
    }
  },
