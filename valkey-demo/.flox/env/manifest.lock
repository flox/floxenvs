    "install": {
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "valkey": {
        "pkg-path": "valkey",
        "pkg-group": "valkey"
      }
    },
    "vars": {
      "VALKEY_HOST": "127.0.0.1",
      "VALKEY_PORT": "16380"
    },
    "hook": {
      "on-activate": "export VALKEY_DATA=\"$FLOX_ENV_CACHE/valkey\"\n\nif [ ! -d \"$VALKEY_DATA\" ]; then\n  mkdir -p \"$VALKEY_DATA\"\nfi\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    'Start Valkey in the background:' \\\n    '  flox services start' \\\n    '  flox activate --start-services' '' \\\n    'Connect to Valkey:' \\\n    \"  valkey-cli -h $VALKEY_HOST -p $VALKEY_PORT\" '' \\\n    'Connection information:' \\\n    \"  host=$VALKEY_HOST\" \\\n    \"  port=$VALKEY_PORT\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "valkey": {
        "command": "  VALKEY_DATA=\"$FLOX_ENV_CACHE/valkey\"\n  mkdir -p \"$VALKEY_DATA\"\n  exec valkey-server \\\n    --bind \"$VALKEY_HOST\" \\\n    --port \"$VALKEY_PORT\" \\\n    --dir \"$VALKEY_DATA\" \\\n    --daemonize no\n"
      }
    }
