  "manifest": {
    "schema-version": "1.17.0",
    "description": "NVIDIA SANA tools for generating images from text prompts.\n",
    "install": {
      "accelerate": {
        "pkg-path": "python313Packages.accelerate",
        "pkg-group": "sana"
      },
      "diffusers": {
        "pkg-path": "python313Packages.diffusers",
