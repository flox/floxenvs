      },
      "pillow": {
        "pkg-path": "python313Packages.pillow",
        "pkg-group": "sana"
      },
      "protobuf": {
        "pkg-path": "python313Packages.protobuf",
        "pkg-group": "sana"
      },
      "python": {
        "pkg-path": "python313",
