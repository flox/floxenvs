schema-version = "1.17.0"

description = '''
# graphify — knowledge graphs for Claude Code

The graphify skill is pre-installed via
agent-stacks/agent-plugin-graphify-labs-graphify.
Start Claude Code with flox-agent, then run it:

```bash
flox-agent launch claude
```

```text
/graphify-labs-graphify:graphify .
```

Or use the CLI directly:

```bash
graphify .
graphify ./raw --mode deep
graphify ./raw --update
```

Query the graph:

```bash
graphify query "what connects X to Y?"
graphify path "Module" "Database"
graphify explain "Concept"
```
'''

[include]
environments = [
  { dir = "../graphify" }
]

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
