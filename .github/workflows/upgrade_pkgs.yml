name: "Upgrade Packages"

on:
  workflow_dispatch:
    inputs:
      package:
        description: >
          Package to upgrade. Leave empty to upgrade
          all packages.
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 */6 * * *"

env:
  FLOX_DISABLE_METRICS: "true"
  NIX_CONFIG: "extra-experimental-features = nix-command"

jobs:

  discover:
    name: "Find packages"
    runs-on: "blacksmith-2vcpu-ubuntu-2404"
    timeout-minutes: 10

    outputs:
      packages: "${{ steps.discover.outputs.packages }}"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Find packages"
        id: "discover"
        env:
          SINGLE_PKG: "${{ inputs.package }}"
        run: |
          set -euo pipefail

          if [ -n "$SINGLE_PKG" ]; then
            echo "packages=[\"$SINGLE_PKG\"]" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find all packages with upgrade.sh
          pkgs="[]"
          for dir in .flox/pkgs/*/; do
            name="$(basename "$dir")"
            if [ -x "$dir/upgrade.sh" ]; then
              pkgs=$(echo "$pkgs" | jq -c \
                ". + [\"$name\"]")
            fi
          done

          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Packages: $pkgs"

  upgrade:
    name: "Upgrade '${{ matrix.package }}'"
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 30
    needs: ["discover"]
    if: needs.discover.outputs.packages != '[]'

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix

      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"

      - name: "Install flox"
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0

      - name: "Run update script"
        env:
          # Authenticated GitHub API calls (5000/hr) instead of the
          # 60/hr unauthenticated limit shared across runner IPs.
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          # Run inside flox activate so build tools
          # (npm, nix-prefetch-url, etc.) are available
          flox activate -- \
            bash .flox/pkgs/${{ matrix.package }}/upgrade.sh

      - name: "Create Pull Request"
        id: "create-pr"
        uses: "peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1" # v8
        with:
          token: "${{ secrets.MANAGED_FLOXBOT_GITHUB_ACCESS_TOKEN_REPO_SCOPE }}"
          add-paths: |
            .flox/pkgs/${{ matrix.package }}
          commit-message: "chore(${{ matrix.package }}): upgrade to latest version"
          committer: "FloxBot <bot@flox.dev>"
          author: "FloxBot <bot@flox.dev>"
          base: "main"
          branch: "chore-upgrade-${{ matrix.package }}"
          delete-branch: true
          title: "chore(${{ matrix.package }}): upgrade to latest version"
          body: |
            Runs `upgrade.sh` for `${{ matrix.package }}` and commits any changes.

            Created by [Upgrade Packages workflow](https://github.com/flox/floxenvs/actions/workflows/upgrade_pkgs.yml).
          labels: "team-developer-support"
