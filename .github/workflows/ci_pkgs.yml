name: "CI Packages"

# One workflow owns the whole per-package lifecycle: build (PRs) /
# publish (main), audit, and the audit-driven website (data.json +
# deploy). Fragments are BUILT ONCE here and that same build output is
# audited — no second build in a separate website workflow.

on:
  push:
    branches: ["main"]
    paths:
      - ".flox/**"
      - "scripts/**"
      - ".website/**"
      - ".github/workflows/ci_pkgs.yml"
  pull_request:
    paths:
      - ".flox/**"
      - "scripts/**"
      - ".website/**"
      - ".github/workflows/ci_pkgs.yml"
  workflow_dispatch:
    inputs:
      package:
        description: >
          Single package to build/audit. Leave empty to do all.
        required: false
        default: ""
        type: string
      items:
        description: >
          Audit scope for envs/site: "all" | "changed" |
          "<kind>:<name>,...".
        required: false
        default: "all"
        type: string
      force_rescan:
        description: "Ignore the audit cache and re-run scanners."
        required: false
        default: false
        type: boolean

permissions:
  contents: "write"
  pages: "write"
  id-token: "write"

env:
  FLOX_DISABLE_METRICS: "true"
  # Build from source when a binary-cache substitute fails — cache.nixos.org
  # currently serves a hash-mismatched texlive path (lpform-36918-tex) that
  # breaks skills-video-use's native x86_64-linux build. Augments nix.conf;
  # substituters unchanged.
  NIX_CONFIG: "fallback = true"

jobs:

  discover:
    name: "Discover changed packages"
    runs-on: "blacksmith-2vcpu-ubuntu-2404"
    timeout-minutes: 10

    outputs:
      packages: "${{ steps.discover.outputs.packages }}"
      aarch64-darwin: "${{ steps.discover.outputs.aarch64-darwin }}"
      aarch64-linux: "${{ steps.discover.outputs.aarch64-linux }}"
      x86_64-darwin: "${{ steps.discover.outputs.x86_64-darwin }}"
      x86_64-linux: "${{ steps.discover.outputs.x86_64-linux }}"
      # Single source of truth: does this run publish (main + push/dispatch)
      # or just build (PRs)? Drives job names and the Build/Publish gates.
      is_publish: "${{ steps.discover.outputs.is_publish }}"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0

      - name: "Find changed packages"
        id: "discover"
        env:
          SINGLE_PKG: "${{ inputs.package }}"
          EVENT: "${{ github.event_name }}"
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          BEFORE_SHA: "${{ github.event.before }}"
          ITEMS: "${{ inputs.items }}"
        run: |
          set -euo pipefail

          ALL_SYSTEMS="aarch64-darwin aarch64-linux x86_64-darwin x86_64-linux"

          # ── Packages to build/publish ──
          if [ -n "$SINGLE_PKG" ]; then
            pkgs="[\"$SINGLE_PKG\"]"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual dispatch builds every package.
            pkgs="[]"
            for dir in .flox/pkgs/*/; do
              name="$(basename "$dir")"
              pkgs=$(echo "$pkgs" | jq -c ". + [\"$name\"]")
            done
          else
            if [ "$EVENT" = "pull_request" ]; then
              DIFF_BASE="$BASE_SHA"
            else
              # A push can carry several coalesced merge commits (bot
              # merge waves land seconds apart), so diff the whole push
              # via the event's `before` SHA — HEAD~1 sees only the head
              # commit and silently skips every other package in the
              # push. Fall back to HEAD~1 when `before` is unavailable
              # (force push, new branch).
              DIFF_BASE="$BEFORE_SHA"
              if [ -z "$DIFF_BASE" ] \
                 || ! git cat-file -e "$DIFF_BASE" 2>/dev/null; then
                DIFF_BASE="HEAD~1"
              fi
            fi
            # upgrade.sh isn't part of the build — skip rebuilds when only
            # it changed.
            pkgs="[]"
            for dir in .flox/pkgs/*/; do
              name="$(basename "$dir")"
              build_changes=$(git diff --name-only "$DIFF_BASE" HEAD \
                | grep -E "^\.flox/pkgs/$name/" \
                | grep -vE "^\.flox/pkgs/$name/upgrade\.sh$" || true)
              if [ -n "$build_changes" ]; then
                pkgs=$(echo "$pkgs" | jq -c ". + [\"$name\"]")
              fi
            done
          fi
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Packages: $pkgs"

          # ── CI grouping: bucket the CHANGED set into matrix chunks ──
          # Group is a scheduling hint, not a build unit: chunking runs on
          # the changed set only, so a single-package change always yields
          # a single one-package job regardless of group membership.
          #   publish.json  .ci.solo  = true  → own job, always (heavy
          #                                     source builds: codex, uv2nix
          #                                     venvs, big fragments)
          #   publish.json  .ci.group = "<g>" → explicit group override
          #   default: skills-* → "skills", everything else → "default"
          # Each group is chunked to at most $CHUNK packages per job.
          CHUNK=6
          groups="{}"
          for pkg in $(echo "$pkgs" | jq -r '.[]'); do
            PJ=".flox/pkgs/$pkg/publish.json"
            [ -f "$PJ" ] || continue
            solo=$(jq -r '.ci.solo // false' "$PJ")
            g=$(jq -r '.ci.group // empty' "$PJ")
            if [ "$solo" = "true" ]; then
              groups=$(echo "$groups" | jq -c --arg p "$pkg" '. + {($p): "solo"}')
            elif [ -n "$g" ]; then
              groups=$(echo "$groups" | jq -c --arg p "$pkg" --arg g "$g" '. + {($p): $g}')
            fi
          done

          CHUNK_JQ='
            def chunk(n): [range(0; length; n) as $i | .[$i:$i+n]];
            map({p: ., g: ($groups[.] // (if startswith("skills-") then "skills" else "default" end))})
            | group_by(.g)
            | map(
                if .[0].g == "solo"
                then map({id: .p, pkgs: .p})
                else .[0].g as $g
                  | [.[].p] | chunk($n) | to_entries
                  | map({id: ($g + "-" + ((.key + 1) | tostring)),
                         pkgs: (.value | join(" "))})
                end)
            | add // []'

          # Per-system chunk lists from publish.json. A package builds
          # (and, on main, publishes) only on the systems it declares.
          for sys in $ALL_SYSTEMS; do
            sys_pkgs="[]"
            for pkg in $(echo "$pkgs" | jq -r '.[]'); do
              PJ=".flox/pkgs/$pkg/publish.json"
              if [ -f "$PJ" ]; then
                if [ "$(jq -r 'has("systems")' "$PJ")" = "false" ]; then
                  sys_pkgs=$(echo "$sys_pkgs" | jq -c ". + [\"$pkg\"]")
                elif [ "$(jq -r --arg s "$sys" '.systems | index($s) != null' "$PJ")" = "true" ]; then
                  sys_pkgs=$(echo "$sys_pkgs" | jq -c ". + [\"$pkg\"]")
                fi
              else
                sys_pkgs=$(echo "$sys_pkgs" | jq -c ". + [\"$pkg\"]")
              fi
            done
            sys_chunks=$(echo "$sys_pkgs" \
              | jq -c --argjson groups "$groups" --argjson n "$CHUNK" "$CHUNK_JQ")
            echo "$sys=$sys_chunks" >> "$GITHUB_OUTPUT"
            echo "  $sys: $sys_chunks"
          done

          # ── is_publish: publish on a manual dispatch (any branch) or a
          #    push to main; PRs and other pushes just build. ──
          if [ "$EVENT" = "workflow_dispatch" ] \
             || { [ "$EVENT" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; }; then
            is_publish=true
          else
            is_publish=false
          fi
          echo "is_publish=$is_publish" >> "$GITHUB_OUTPUT"
          echo "is_publish: $is_publish"

  # ── Build (PRs) or publish (main): one job per (package, system) ──
  # The x86_64-linux leg additionally audits fragment CONTENT from the
  # build it just produced — no second build.

  aarch64-darwin:
    name: "${{ needs.discover.outputs.is_publish == 'true' && 'Publish' || 'Build' }} '${{ matrix.chunk.id }}' (aarch64-darwin)"
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 90
    needs: ["discover"]
    if: needs.discover.outputs.aarch64-darwin != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.aarch64-darwin) }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          filter: "blob:none"
      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"
      - name: "Install flox"
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0
      - name: "Setup Tailscale"
        uses: "tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888" # v4.1.3
        with:
          oauth-secret: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true
      - name: "Configure Nix remote builders + private cache"
        uses: "flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f" # main
        with:
          ssh-key: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          remote-builders: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          # Push each build output to the private R2 cache so the
          # `coexist` job can substitute exactly these artifacts instead
          # of rebuilding all packages from source.
          substituter: "${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}"
          substituter-key: "${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}"
          aws-access-key-id: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}"
      - name: "Build"
        if: ${{ needs.discover.outputs.is_publish != 'true' }}
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox build $pkg"
            flox build "$pkg" --system aarch64-darwin || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "BUILD FAILED: ${failed[*]}" >&2; exit 1; }
      - name: "Publish"
        if: ${{ needs.discover.outputs.is_publish == 'true' }}
        env:
          FLOX_FLOXHUB_TOKEN: "${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}"
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox publish $pkg"
            ORG="$(jq -r '.org // "flox"' ".flox/pkgs/$pkg/publish.json" 2>/dev/null || echo flox)"
            flox publish -o "$ORG" "$pkg" --system aarch64-darwin || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "PUBLISH FAILED: ${failed[*]}" >&2; exit 1; }

  aarch64-linux:
    name: "${{ needs.discover.outputs.is_publish == 'true' && 'Publish' || 'Build' }} '${{ matrix.chunk.id }}' (aarch64-linux)"
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 90
    needs: ["discover"]
    if: needs.discover.outputs.aarch64-linux != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.aarch64-linux) }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          filter: "blob:none"
      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"
      - name: "Install flox"
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0
      - name: "Setup Tailscale"
        uses: "tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888" # v4.1.3
        with:
          oauth-secret: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true
      - name: "Configure Nix remote builders + private cache"
        uses: "flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f" # main
        with:
          ssh-key: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          remote-builders: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          # Push each build output to the private R2 cache so the
          # `coexist` job can substitute exactly these artifacts instead
          # of rebuilding all packages from source.
          substituter: "${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}"
          substituter-key: "${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}"
          aws-access-key-id: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}"
      - name: "Build"
        if: ${{ needs.discover.outputs.is_publish != 'true' }}
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox build $pkg"
            flox build "$pkg" --system aarch64-linux || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "BUILD FAILED: ${failed[*]}" >&2; exit 1; }
      - name: "Publish"
        if: ${{ needs.discover.outputs.is_publish == 'true' }}
        env:
          FLOX_FLOXHUB_TOKEN: "${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}"
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox publish $pkg"
            ORG="$(jq -r '.org // "flox"' ".flox/pkgs/$pkg/publish.json" 2>/dev/null || echo flox)"
            flox publish -o "$ORG" "$pkg" --system aarch64-linux || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "PUBLISH FAILED: ${failed[*]}" >&2; exit 1; }

  x86_64-darwin:
    name: "${{ needs.discover.outputs.is_publish == 'true' && 'Publish' || 'Build' }} '${{ matrix.chunk.id }}' (x86_64-darwin)"
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 90
    needs: ["discover"]
    if: needs.discover.outputs.x86_64-darwin != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.x86_64-darwin) }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          filter: "blob:none"
      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"
      - name: "Install flox"
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0
      - name: "Setup Tailscale"
        uses: "tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888" # v4.1.3
        with:
          oauth-secret: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true
      - name: "Configure Nix remote builders + private cache"
        uses: "flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f" # main
        with:
          ssh-key: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          remote-builders: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          # Push each build output to the private R2 cache so the
          # `coexist` job can substitute exactly these artifacts instead
          # of rebuilding all packages from source.
          substituter: "${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}"
          substituter-key: "${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}"
          aws-access-key-id: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}"
      - name: "Build"
        if: ${{ needs.discover.outputs.is_publish != 'true' }}
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox build $pkg"
            flox build "$pkg" --system x86_64-darwin || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "BUILD FAILED: ${failed[*]}" >&2; exit 1; }
      - name: "Publish"
        if: ${{ needs.discover.outputs.is_publish == 'true' }}
        env:
          FLOX_FLOXHUB_TOKEN: "${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}"
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox publish $pkg"
            ORG="$(jq -r '.org // "flox"' ".flox/pkgs/$pkg/publish.json" 2>/dev/null || echo flox)"
            flox publish -o "$ORG" "$pkg" --system x86_64-darwin || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "PUBLISH FAILED: ${failed[*]}" >&2; exit 1; }

  x86_64-linux:
    name: "${{ needs.discover.outputs.is_publish == 'true' && 'Publish' || 'Build' }} '${{ matrix.chunk.id }}' (x86_64-linux)"
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 90
    needs: ["discover"]
    if: needs.discover.outputs.x86_64-linux != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.x86_64-linux) }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          filter: "blob:none"
      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"
      - name: "Install flox"
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0
      - name: "Setup Tailscale"
        uses: "tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888" # v4.1.3
        with:
          oauth-secret: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true
      - name: "Configure Nix remote builders + private cache"
        uses: "flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f" # main
        with:
          ssh-key: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          remote-builders: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          # Push each build output to the private R2 cache so the
          # `coexist` job can substitute exactly these artifacts instead
          # of rebuilding all packages from source.
          substituter: "${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}"
          substituter-key: "${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}"
          aws-access-key-id: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}"
      # Always build x86_64-linux so the audit has a build output (and,
      # on main, so publish has its artifact).
      - name: "Build"
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox build $pkg"
            flox build "$pkg" --system x86_64-linux || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "BUILD FAILED: ${failed[*]}" >&2; exit 1; }
      - name: "Publish"
        if: ${{ needs.discover.outputs.is_publish == 'true' }}
        env:
          FLOX_FLOXHUB_TOKEN: "${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}"
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            echo "::group::flox publish $pkg"
            ORG="$(jq -r '.org // "flox"' ".flox/pkgs/$pkg/publish.json" 2>/dev/null || echo flox)"
            flox publish -o "$ORG" "$pkg" --system x86_64-linux || failed+=("$pkg")
            echo "::endgroup::"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "PUBLISH FAILED: ${failed[*]}" >&2; exit 1; }
      # Audit only skills-* packages (the Claude Code skill/plugin
      # fragments) — gated on the chunk containing any skills-* member;
      # the loop below re-checks per package. Everything else is
      # built/published, not audited.
      # Realizing the .website env normally takes ~17s, but under load
      # (the nightly bot PR wave) substitution sometimes stalls with
      # zero output until the 90-minute job timeout cancels the run.
      # Health-check the activation first with a hard 1-minute bound and
      # three attempts — a stall costs 3 minutes and a clear error, not
      # 90 silent ones.
      - name: "Warm .website env (bounded)"
        if: ${{ contains(matrix.chunk.pkgs, 'skills-') }}
        uses: "nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60" # v4.0.0
        with:
          timeout_minutes: 1
          max_attempts: 3
          retry_wait_seconds: 10
          command: "flox activate -d .website -- true"
      - name: "Audit fragment content"
        if: ${{ contains(matrix.chunk.pkgs, 'skills-') }}
        # Backstop for the audit run itself — the env is already
        # realized above, so this activation is instant.
        timeout-minutes: 20
        # Fragments are content-audited from the build above; run-audit.sh
        # reuses result-<pkg> and runs the flox-ai audit engine. The
        # flox-ai + skill-audit tools live in the .website env (NOT the
        # root env — they're floxenvs-flake-sourced and would poison
        # `flox build`'s nixpkgs resolution).
        shell: "flox activate -d .website -- bash -e {0}"
        run: |
          set -euo pipefail
          failed=()
          for pkg in ${{ matrix.chunk.pkgs }}; do
            case "$pkg" in
              skills-*)
                echo "::group::audit $pkg"
                REPO_ROOT="$PWD" bash scripts/run-audit.sh skill "$pkg" || failed+=("$pkg")
                echo "::endgroup::"
                ;;
            esac
          done
          [ ${#failed[@]} -eq 0 ] || { echo "AUDIT FAILED: ${failed[*]}" >&2; exit 1; }
      - name: "Upload fragment metrics"
        if: ${{ contains(matrix.chunk.pkgs, 'skills-') }}
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
        with:
          # One artifact per chunk; it holds <pkg>/metrics.json for every
          # audited package (the site job globs them out).
          name: "metrics-skill-${{ matrix.chunk.id }}"
          path: "audit/skill/"
          if-no-files-found: "error"

  # ── Site: collect metrics, build data.json, deploy (main only) ──
  site:
    name: "Build + deploy site"
    # Wait on every system leg (not just x86_64-linux) so the site builds
    # only after all builds/publishes settle. always() keeps it running
    # even if a leg fails — data.json falls back to prior metrics.
    needs: ["discover", "aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
    if: always() && needs.discover.result == 'success'
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 30
    # Serialize the site/deploy half (gh-pages) per ref. A single global
    # group means every PR's site job lands in the same queue; GitHub keeps
    # only one running + one pending per group and CANCELS the rest, which
    # cancels the whole CI Packages run and fails the Summary gate. Keying
    # the group on github.ref isolates each PR while still serialising the
    # only ref that actually deploys (refs/heads/main) against itself.
    concurrency:
      group: "pages-${{ github.ref }}"
      cancel-in-progress: false
    # Every run step executes inside the .website flox env (node, jq, …).
    # Absolute -d path so steps with `working-directory: .website` still
    # resolve the env relative to the repo root, not their cwd.
    defaults:
      run:
        shell: "flox activate -d ${{ github.workspace }}/.website -- bash -e {0}"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"
      - name: "Install flox"
        # Required so the run steps' `flox activate -d .website` works.
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0
      - name: "Download fresh metrics"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
        with:
          pattern: "metrics-*"
          path: "_metrics_in"
          merge-multiple: false
      - name: "Stage fresh metrics"
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p .website/src/content/metrics
          # Each artifact is metrics-<kind>-<chunkid> and holds
          # <name>/metrics.json for every audited package in that chunk.
          for d in _metrics_in/metrics-*; do
            base=$(basename "$d")        # metrics-<kind>-<chunkid>
            kind=$(echo "$base" | cut -d- -f2)
            mkdir -p ".website/src/content/metrics/$kind"
            for f in "$d"/*/metrics.json; do
              name=$(basename "$(dirname "$f")")
              cp "$f" ".website/src/content/metrics/$kind/$name.json"
            done
          done
      - name: "Fetch prior metrics for unchanged items"
        env:
          DEPLOY_URL: "https://flox.github.io/floxenvs"
        run: |
          set -euo pipefail
          export REPO_ROOT="$PWD"
          mapfile -t items < <(bash scripts/list-items.sh)
          for item in "${items[@]}"; do
            kind="${item%%:*}"; name="${item##*:}"
            target=".website/src/content/metrics/$kind/$name.json"
            [ -f "$target" ] && continue
            mkdir -p "$(dirname "$target")"
            # env metrics under /envs/, everything else under /packages/.
            case "$kind" in
              env) url="$DEPLOY_URL/envs/$name/metrics.json" ;;
              *)   url="$DEPLOY_URL/packages/$name/metrics.json" ;;
            esac
            if curl -sfL --max-time 10 -o "$target" "$url"; then
              echo "fetched prior metrics for $item"
            else
              rm -f "$target"
              echo "no prior metrics for $item"
            fi
          done
      - name: "Surface metrics.json into dist for next deploy"
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            rel="${f#.website/src/content/metrics/}"
            kind="${rel%%/*}"
            name="$(basename "${rel#"$kind"/}" .json)"
            case "$kind" in
              env) dest=".website/public/envs/$name/metrics.json" ;;
              *)   dest=".website/public/packages/$name/metrics.json" ;;
            esac
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < <(find .website/src/content/metrics -name '*.json')
      - name: "Install"
        working-directory: ".website"
        run: "npm ci"
      - name: "Build data.json"
        working-directory: ".website"
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/build-data-json.mjs --full
      - name: "Resolve OG font from the .website env"
        # Inter ships from the .website flox env (the `inter` package), not
        # apt. $FLOX_ENV resolves to the per-system run dir at activation.
        run: |
          set -euo pipefail
          # share/fonts is a symlink into the nix store, so find needs -L to
          # descend it. Non-fatal: if no font turns up, the OG route falls
          # back to reading it directly / a system font — don't fail CI.
          font="$(find -L "$FLOX_ENV/share/fonts" -iname 'InterVariable.ttf' 2>/dev/null | head -1)"
          [ -n "$font" ] || font="$(find -L "$FLOX_ENV/share/fonts" -iname '*.ttf' 2>/dev/null | head -1)"
          if [ -n "$font" ]; then
            echo "OG_FONT_PATH=$font" >> "$GITHUB_ENV"
            echo "OG font: $font"
          else
            echo "no Inter font in .website env; OG uses its fallback"
          fi
      - name: "Build"
        working-directory: ".website"
        env:
          SITE_URL: "${{ vars.SITE_URL || 'https://envs.flox.dev' }}"
          BASE_PATH: "${{ vars.BASE_PATH || '/' }}"
        run: "npm run build"
      - name: "Publish to gh-pages branch"
        if: ${{ needs.discover.outputs.is_publish == 'true' }}
        uses: "peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453" # v4
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_dir: ".website/dist"
          publish_branch: "gh-pages"
          enable_jekyll: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.sha }}"

  # ── Coexistence invariant: every skill + agent + audit tool installs into
  #    ONE Flox env without colliding (the original bug: four python skills
  #    each shipped bin/python3). Runs after the build matrix, in parallel
  #    with the site job. PUBLISH RUNS ONLY (push to main / dispatch): it
  #    builds every package from source, which is too slow for PRs; the build
  #    matrix already gates each package on PRs. always() keeps it independent
  #    of a single leg failing. coexist-check.sh builds every package from
  #    source and installs each ./result-<pkg> into one throwaway env.
  coexist:
    name: "All skills + agents + audit tools coexist in one Flox env"
    needs: ["discover", "aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.is_publish == 'true'
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    timeout-minutes: 60
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: "Create Nix store mount point"
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix
      - name: "Mount Nix store"
        uses: "useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151" # v1
        with:
          key: "${{ github.repository }}-nix-${{ runner.arch }}"
          path: "/nix"
      - name: "Install flox"
        uses: "flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1" # v2.6.0
      - name: "Setup Tailscale"
        uses: "tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888" # v4.1.3
        with:
          oauth-secret: "${{ secrets.MANAGED_TAILSCALE_AUTH_KEY }}"
          tags: "tag:ci"
          timeout: "30s"
          use-cache: true
      - name: "Configure Nix remote builders + private cache"
        uses: "flox/configure-nix-action@28a4eb7f63bf54c91670b4a698f0a9ebfb95384f" # main
        with:
          ssh-key: "${{ secrets.MANAGED_FLOXBOT_SSH_KEY }}"
          remote-builders: "${{ vars.MANAGED_REMOTE_BUILDERS }}"
          # Read from the same private S3 cache the build matrix pushed
          # to, so the per-package `flox build` in coexist-check.sh
          # substitutes the already-built artifacts instead of compiling
          # every package from source (which chronically hit the 60m cap).
          substituter: "${{ vars.MANAGED_CACHE_PRIVATE_R2_BUCKET }}"
          substituter-key: "${{ secrets.MANAGED_CACHE_PRIVATE_SECRET_KEY }}"
          aws-access-key-id: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.MANAGED_CACHE_PRIVATE_R2_SECRET_ACCESS_KEY }}"
      - name: "Assert coexistence"
        env:
          FLOX_FLOXHUB_TOKEN: "${{ secrets.MANAGED_FLOX_FLOXHUB_TOKEN }}"
        run: |
          bash scripts/coexist-check.sh
