schema-version = "1.17.0"

description = '''
# Basic Memory
Local-first knowledge graph wired into Claude Code

```text
basic-memory --help        — CLI overview
basic-memory project list  — list projects
claude                     — start Claude Code with
                              basic-memory MCP wired up
```
'''

[include]
environments = [{ dir = "../basic-memory" }]

[install]
flox-ai.pkg-path = "flox/flox-ai"
flox-ai.pkg-group = "flox-ai"

[hook]
on-activate = '''
# Project-scope MCP wiring. claude reads .mcp.json from CWD,
# so basic-memory is available immediately when claude is run
# from this dir. Idempotent — overwritten every activation.
cat > "$FLOX_ENV_PROJECT/.mcp.json" <<'JSON'
{
  "mcpServers": {
    "basic-memory": {
      "command": "basic-memory",
      "args": ["mcp"]
    }
  }
}
JSON
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
