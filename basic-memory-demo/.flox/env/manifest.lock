    "schema-version": "1.17.0",
    "description": "# Basic Memory\nLocal-first knowledge graph wired into Claude Code\n\n```bash\nbasic-memory --help        # CLI overview\nbasic-memory project list  # list projects\n# Start Claude Code with basic-memory MCP wired up\nclaude\n```\n",
    "install": {
      "basic-memory": {
        "pkg-path": "flox/basic-memory",
        "pkg-group": "basic-memory",
        "systems": [
          "aarch64-darwin",
          "aarch64-linux",
          "x86_64-linux"
        ]
      },
      "flox-agent": {
        "pkg-path": "flox/flox-agent",
        "pkg-group": "flox-agent"
      }
    },
    "hook": {
      "on-activate": "# Project-scope MCP wiring. claude reads .mcp.json from CWD,\n# so basic-memory is available immediately when claude is run\n# from this dir. Idempotent — overwritten every activation.\ncat > \"$FLOX_ENV_PROJECT/.mcp.json\" <<'JSON'\n{\n  \"mcpServers\": {\n    \"basic-memory\": {\n      \"command\": \"basic-memory\",\n      \"args\": [\"mcp\"]\n    }\n  }\n}\nJSON\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
