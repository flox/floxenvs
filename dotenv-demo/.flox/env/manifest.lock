    "schema-version": "1.17.0",
    "description": "# dotenv\n",
    "install": {
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      }
    },
    "vars": {
      "DOTENV_FILE": ".env"
    },
    "hook": {
      "on-activate": "if [ -f \"$DOTENV_FILE\" ]; then\n  set -o allexport\n  source \"$DOTENV_FILE\"\n  set +o allexport\nfi\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  if [ -f \"$DOTENV_FILE\" ]; then\n    LOADED=\"$(grep -c '=' \"$DOTENV_FILE\" 2>/dev/null || echo 0)\"\n    gum style --border double --margin '1 2' \\\n      --padding '1 4' \\\n      'dotenv environment ready!' '' \\\n      \"Loaded $LOADED variables from $DOTENV_FILE\"\n  else\n    gum style --border double --margin '1 2' \\\n      --padding '1 4' \\\n      'dotenv environment ready!' '' \\\n      \"No $DOTENV_FILE file found.\" \\\n      'Create one to auto-load variables.'\n  fi\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
