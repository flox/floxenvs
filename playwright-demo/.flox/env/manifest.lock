{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Playwright demo — browser automation in a Flox env\n\nInstall the chromium binary (first time only):\n\n```text\nplaywright install chromium\n```\n\nRun the sample test against demo.playwright.dev:\n\n```text\nplaywright test\n```\n\nOr expose Playwright as an MCP service:\n\n```text\nflox services start playwright-mcp\n```\n\nOr drive a browser directly from the CLI:\n\n```text\nplaywright-cli open https://playwright.dev\n```\n",
    "install": {
      "flox-ai": {
        "pkg-path": "flox/flox-ai",
        "pkg-group": "flox-ai"
      },
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "playwright": {
        "pkg-path": "playwright",
        "pkg-group": "playwright"
      },
      "playwright-cli": {
        "pkg-path": "flox/playwright-cli",
        "pkg-group": "playwright"
      },
      "playwright-driver": {
        "pkg-path": "playwright-driver",
        "pkg-group": "playwright"
      },
      "playwright-mcp": {
        "pkg-path": "playwright-mcp",
        "pkg-group": "playwright"
      },
      "playwright-test": {
        "pkg-path": "playwright-test",
        "pkg-group": "playwright"
      },
      "skills-playwright-cli": {
        "pkg-path": "flox/skills-playwright-cli",
        "pkg-group": "playwright"
      }
    },
    "vars": {
      "PLAYWRIGHT_HEADLESS": "true",
      "PLAYWRIGHT_MCP_HOST": "127.0.0.1",
      "PLAYWRIGHT_MCP_PORT": "18931"
    },
    "hook": {
      "on-activate": "dir=\"$FLOX_ENV_CACHE/playwright\"\nexport PLAYWRIGHT_DATA_DIR=\"$dir\"\nexport PLAYWRIGHT_BROWSERS_PATH=\"${PLAYWRIGHT_BROWSERS_PATH:-$dir/browsers}\"\nmkdir -p \"$PLAYWRIGHT_BROWSERS_PATH\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    \"MCP endpoint: http://${PLAYWRIGHT_MCP_HOST}:${PLAYWRIGHT_MCP_PORT}/\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "playwright-mcp": {
        "command": "dir=\"${PLAYWRIGHT_DATA_DIR:-$FLOX_ENV_CACHE/playwright}\"\nexport PLAYWRIGHT_BROWSERS_PATH=\"${PLAYWRIGHT_BROWSERS_PATH:-$dir/browsers}\"\nmkdir -p \"$PLAYWRIGHT_BROWSERS_PATH\"\nexec playwright-mcp \\\n  --host \"$PLAYWRIGHT_MCP_HOST\" \\\n  --port \"$PLAYWRIGHT_MCP_PORT\" \\\n  --browser chromium\n"
      }
    }
  },
