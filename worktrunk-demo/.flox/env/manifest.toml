schema-version = "1.17.0"

description = '''
# Worktrunk
git worktrees, made easy

```text
wt switch <branch>        — switch / create worktree
wt switch -c -x claude X  — create + start coding agent
wt list                   — list worktrees with status
wt merge                  — merge + clean up
wt remove                 — remove worktree + branch
```

```text
Docs: https://worktrunk.dev
```
'''

[include]
environments = [
  { dir = "../worktrunk" }
]

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
