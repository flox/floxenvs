  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Socket Firewall demo (sfw-demo)\n\nWARNING: best run inside a container or sandbox\n\nnpm, pip, and cargo route through sfw automatically.\n\nTry a flagged package (sfw blocks it):\n\n```bash\nnpm install lodahs\npip install fabrice\ncargo install rustdecimal\n```\n\nAnd a clean one (sfw lets it through):\n\n```bash\nnpm install lodash\n```\n\nFull walkthrough: README.md\n",
    "install": {
      "cargo": {
        "pkg-path": "cargo",
        "pkg-group": "demo-tools"
      },
      "nodejs": {
        "pkg-path": "nodejs",
        "pkg-group": "demo-tools"
      },
      "pip": {
        "pkg-path": "python313Packages.pip",
        "pkg-group": "demo-tools"
      },
      "sfw": {
        "pkg-path": "flox/sfw",
        "pkg-group": "sfw"
      }
    },
    "vars": {
      "PIP_BREAK_SYSTEM_PACKAGES": "true",
      "PIP_REQUIRE_VIRTUALENV": "false",
      "SFW_VERBOSE": "true"
    },
    "hook": {
      "on-activate": "# Route supported package managers on PATH through sfw transparently\n# (shims shipped with the flox/sfw package). This covers\n# `flox activate -- cmd`, scripts, and CI; [profile.common] re-prepends\n# it for interactive shells, whose PATH flox may reset to put\n# $FLOX_ENV/bin first after the hook runs.\nexport PATH=\"$FLOX_ENV/libexec/sfw-shims:$PATH\"\n\n# Per-environment \"global\" install locations so package-manager installs\n# land inside $FLOX_ENV_CACHE without sudo or polluting $HOME.\nexport NPM_CONFIG_PREFIX=\"$FLOX_ENV_CACHE/npm-global\"\nmkdir -p \"$NPM_CONFIG_PREFIX/bin\"\nexport CARGO_HOME=\"$FLOX_ENV_CACHE/cargo\"\nmkdir -p \"$CARGO_HOME/bin\"\nexport PIP_TARGET=\"$FLOX_ENV_CACHE/pip-target\"\nmkdir -p \"$PIP_TARGET\"\n\n# Keep the sfw shim dir at the front of PATH, ahead of the per-env\n# install bins, so npm/pip/cargo still resolve to the shim and route\n# through sfw.\nexport PATH=\"$FLOX_ENV/libexec/sfw-shims:$NPM_CONFIG_PREFIX/bin:$CARGO_HOME/bin:$PATH\"\n"
    },
    "profile": {
      "common": "# Re-prepend the shim dir for interactive shells (see hook note above).\nexport PATH=\"$FLOX_ENV/libexec/sfw-shims:$PATH\"\n",
      "bash": "source \"$FLOX_ENV/libexec/sfw-shims/activate.bash\"\n",
      "zsh": "source \"$FLOX_ENV/libexec/sfw-shims/activate.zsh\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
