      "hook": {
        "on-activate": "# Per-environment \"global\" install locations so package-manager installs\n# land inside $FLOX_ENV_CACHE without sudo or polluting $HOME.\nexport NPM_CONFIG_PREFIX=\"$FLOX_ENV_CACHE/npm-global\"\nmkdir -p \"$NPM_CONFIG_PREFIX/bin\"\nexport CARGO_HOME=\"$FLOX_ENV_CACHE/cargo\"\nmkdir -p \"$CARGO_HOME/bin\"\nexport PIP_TARGET=\"$FLOX_ENV_CACHE/pip-target\"\nmkdir -p \"$PIP_TARGET\"\n\n# Keep the sfw shim dir at the front of PATH, ahead of the per-env\n# install bins, so npm/pip/cargo still resolve to the shim and route\n# through sfw.\nexport PATH=\"$FLOX_ENV/libexec/sfw-shims:$NPM_CONFIG_PREFIX/bin:$CARGO_HOME/bin:$PATH\"\n\n# The banner has to print in every shell, including ones that attach to\n# an existing activation and so never re-run this hook. [profile] common\n# is sourced by bash, zsh, fish and tcsh, and no conditional or command\n# substitution is valid in all four — only a bare command call is. So\n# generate the banner as a bash script here and let common just run it.\n# Write to a temp file and mv into place so shells attaching mid-write\n# never execute a truncated script.\ncat > \"$FLOX_ENV_CACHE/banner.sh.$$\" <<'BANNER'\n#!/usr/bin/env bash\n[ \"${FLOX_ENVS_TESTING:-}\" = \"1\" ] && exit 0\n\ngum style \\\n  --border rounded --border-foreground 212 \\\n  --padding \"1 2\" --margin \"1 0\" \\\n  \"$(gum style --bold --foreground 212 'Socket Firewall demo (sfw-demo)')\" \\\n  \"\" \\\n  \"$(gum style --bold --foreground 196 'WARNING: best run inside a container or sandbox')\" \\\n  \"\" \\\n  \"$(gum style --italic 'npm, pip, and cargo route through sfw automatically.')\" \\\n  \"\" \\\n  \"$(gum style --bold 'Try a flagged package (sfw blocks it):')\" \\\n  \"  npm install lodahs\" \\\n  \"  pip install fabrice\" \\\n  \"  cargo install rustdecimal\" \\\n  \"\" \\\n  \"$(gum style --bold 'And a clean one (sfw lets it through):')\" \\\n  \"  npm install lodash\" \\\n  \"\" \\\n  \"Full walkthrough: README.md\"\nBANNER\nchmod +x \"$FLOX_ENV_CACHE/banner.sh.$$\"\nmv -f \"$FLOX_ENV_CACHE/banner.sh.$$\" \"$FLOX_ENV_CACHE/banner.sh\"\n"
      },
      "profile": {
        "common": "\"$FLOX_ENV_CACHE/banner.sh\"\n"
      },
      "options": {
        "systems": [
          "aarch64-darwin",
          "aarch64-linux",
          "x86_64-linux"
        ]
      },
