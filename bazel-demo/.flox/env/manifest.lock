  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Bazel development environment\n\nTry the sample build:\n\n```bash\nflox build hello\n./result-hello/bin/hello\n```\n",
    "install": {
      "bazel": {
        "pkg-path": "flox/bazel",
        "pkg-group": "bazel",
        "systems": [
          "aarch64-darwin"
        ]
      },
      "bazel_catalog": {
        "pkg-path": "bazel_9",
        "pkg-group": "bazel",
        "systems": [
          "aarch64-linux",
          "x86_64-linux"
        ]
      },
      "gcc": {
        "pkg-path": "gcc",
        "pkg-group": "bazel-toolchain",
        "systems": [
          "aarch64-linux",
          "x86_64-linux"
        ]
      }
    },
    "hook": {
      "on-activate": "export BAZEL_CACHE_DIR=\"$FLOX_ENV_CACHE/bazel\"\nmkdir -p \"$BAZEL_CACHE_DIR\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "build": {
      "hello": {
        "command": "set -eo pipefail\n\nbazel build //:hello\n\nmkdir -p \"$out/bin\"\ncp -L bazel-bin/hello_/hello \"$out/bin/hello\"\nchmod +x \"$out/bin/hello\"\n",
        "version": "0.0.1",
        "description": "Sample Go binary built with Bazel + rules_go"
      }
    }
  },
