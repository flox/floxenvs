  ],
  "compose": {
    "composer": {
      "schema-version": "1.17.0",
      "description": "# Podman\n\nCommands:\n\n```bash\npodman run '<image>'  # Run a container\npodman-compose up     # Start services\npodman-tui            # Terminal UI\nundocker '<image>'    # Extract image\n```\n",
      "install": {
        "gum": {
          "pkg-path": "gum",
          "pkg-group": "demo-tools"
        },
        "podman-tui": {
          "pkg-path": "podman-tui",
          "pkg-group": "demo-tools"
        },
        "undocker": {
          "pkg-path": "undocker",
          "pkg-group": "demo-tools"
        }
      },
      "hook": {
        "on-activate": "if [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    'Podman environment ready!' '' \\\n    'podman version:' \\\n    \"  $(podman --version)\"\nfi\n"
      },
      "profile": {
        "common": "if [ \"$(uname -s)\" = 'Darwin' ] \\\n    && [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  trap 'gum confirm \"Stop virtual machine?\" \\\n    && gum spin --spinner dot \\\n         --title \"Stopping machine...\" \\\n         -- podman machine stop \\\n    ; echo \"Podman machine stopped\"' EXIT\nfi\n"
      },
      "options": {
        "systems": [
          "aarch64-darwin",
          "aarch64-linux",
          "x86_64-linux"
        ]
      },
      "include": {
        "environments": [
          {
            "dir": "../podman"
          }
        ]
      }
    },
    "include": [
      {
        "manifest": {
          "schema-version": "1.17.0",
          "description": "Podman and Podman Compose for running rootless containers.\n",
          "install": {
            "podman": {
              "pkg-path": "podman",
              "pkg-group": "podman"
            },
            "podman-compose": {
              "pkg-path": "podman-compose",
              "pkg-group": "podman"
            },
            "qemu": {
              "pkg-path": "qemu",
              "pkg-group": "podman",
              "systems": [
                "aarch64-darwin"
              ]
            }
          },
          "hook": {
            "on-activate": "# Ensure containers policy exists on Linux\nif [ \"$(uname -s)\" = \"Linux\" ]; then\n  POLICY=\"$HOME/.config/containers/policy.json\"\n  if [ ! -f \"$POLICY\" ]; then\n    mkdir -p \"$(dirname \"$POLICY\")\"\n    printf '%s\\n' \\\n      '{\"default\": [{\"type\": \"insecureAcceptAnything\"}]}' \\\n      > \"$POLICY\"\n  fi\nfi\n"
          },
          "options": {
            "systems": [
              "aarch64-darwin",
              "aarch64-linux",
              "x86_64-linux"
            ]
          }
        },
        "name": "podman",
        "descriptor": {
          "dir": "../podman"
        }
      }
    ],
    "warnings": [
      {
        "warning": {
          "Overriding": [
            "options",
            "systems"
          ]
        },
        "higher_priority_name": "Current manifest"
      }
    ]
  }
}
