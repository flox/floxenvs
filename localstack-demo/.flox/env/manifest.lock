{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# LocalStack\n\nStart LocalStack in the background:\n\n```text\nflox services start\nflox activate --start-services\n```\n\nOnce it starts, see available services with:\n\n```text\nlocalstack status services\n```\n",
    "install": {
      "awscli2": {
        "pkg-path": "awscli2",
        "pkg-group": "localstack"
      },
      "kubectl": {
        "pkg-path": "kubectl",
        "pkg-group": "localstack-tools"
      },
      "localstack": {
        "pkg-path": "localstack",
        "pkg-group": "localstack"
      },
      "python3": {
        "pkg-path": "python3",
        "pkg-group": "localstack"
      }
    },
    "hook": {
      "on-activate": "export LOCALSTACK_CACHE=\"$FLOX_ENV_CACHE/localstack\"\nexport PYTHON_DIR=\"$LOCALSTACK_CACHE/venv\"\n\nif [ ! -d \"$PYTHON_DIR\" ]; then\n  python -m venv \"$PYTHON_DIR\" 2>/dev/null\nfi\n\n(\n  source \"$PYTHON_DIR/bin/activate\"\n  pip install -q awscli-local\n)\n"
    },
    "profile": {
      "bash": "source \"$PYTHON_DIR/bin/activate\"\n",
      "zsh": "source \"$PYTHON_DIR/bin/activate\"\n",
      "fish": "source \"$PYTHON_DIR/bin/activate.fish\"\n",
      "tcsh": "source \"$PYTHON_DIR/bin/activate.csh\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "localstack": {
        "command": "docker rm -f localstack-main 2>/dev/null; localstack start -d",
        "is-daemon": true,
        "shutdown": {
          "command": "localstack stop"
        }
      }
    }
  },
