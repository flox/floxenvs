{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "Firecrawl CLI and agent skills for scraping and crawling the web.\n",
    "install": {
      "agent-plugin-firecrawl": {
        "pkg-path": "agent-stacks/agent-plugin-firecrawl",
        "pkg-group": "agent-plugin-firecrawl"
      },
      "firecrawl-cli": {
        "pkg-path": "flox/firecrawl-cli",
        "pkg-group": "firecrawl"
      },
      "flox-agent": {
        "pkg-path": "flox/flox-agent",
        "pkg-group": "flox-agent"
      }
    },
    "vars": {
      "FIRECRAWL_API_KEY": ""
    },
    "hook": {
      "on-activate": "dir=\"$FLOX_ENV_CACHE/firecrawl\"\nmkdir -p \"$dir\"\nexport FIRECRAWL_DATA_DIR=\"$dir\"\n\n# Persist the key across activations: if it isn't set in the\n# environment but was saved to the cache before, load it back.\nkey_file=\"$dir/api-key\"\nif [ -z \"${FIRECRAWL_API_KEY:-}\" ] && [ -f \"$key_file\" ]; then\n  FIRECRAWL_API_KEY=\"$(cat \"$key_file\")\"\n  export FIRECRAWL_API_KEY\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
