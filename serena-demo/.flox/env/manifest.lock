{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Serena demo — IDE-grade MCP toolkit for coding agents\n\nRun the CLI:\n\n```text\nserena --help\n```\n\nStart the MCP server inside the sample project:\n\n```text\ncd sample-project\nflox services start serena-mcp\n```\n",
    "install": {
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "nodejs": {
        "pkg-path": "nodejs_20",
        "pkg-group": "serena"
      },
      "serena": {
        "pkg-path": "flox/serena",
        "pkg-group": "serena"
      }
    },
    "vars": {
      "SERENA_MCP_HOST": "127.0.0.1",
      "SERENA_MCP_PORT": "19121",
      "SERENA_TRANSPORT": "sse"
    },
    "hook": {
      "on-activate": "dir=\"$FLOX_ENV_CACHE/serena\"\nexport SERENA_DATA_DIR=\"$dir\"\nmkdir -p \"$dir\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    \"MCP endpoint: http://${SERENA_MCP_HOST}:${SERENA_MCP_PORT}/sse\" \\\n    '' \\\n    'Then point Claude Desktop / Cursor / Codex at that URL.'\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "serena-mcp": {
        "command": "dir=\"${SERENA_DATA_DIR:-$FLOX_ENV_CACHE/serena}\"\nmkdir -p \"$dir\"\nexec serena start-mcp-server \\\n  --transport \"$SERENA_TRANSPORT\" \\\n  --host \"$SERENA_MCP_HOST\" \\\n  --port \"$SERENA_MCP_PORT\"\n"
      }
    }
  },
