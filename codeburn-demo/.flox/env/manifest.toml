schema-version = "1.17.0"

description = '''
# CodeBurn
AI coding token observability

```text
codeburn          — interactive dashboard
codeburn today    — today's usage
codeburn month    — this month's usage
codeburn optimize — find waste, get fixes
codeburn compare  — side-by-side models
```
'''

[include]
environments = [{ dir = "../codeburn" }]

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
