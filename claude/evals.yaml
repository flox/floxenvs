# evals for the claude env. Each case runs in an ephemeral
# `flox activate -- bash -c <cmd>` shell. Assertions are
# deterministic.

cases:
  - id: claude-help-works
    cmd: "claude --help"
    assert:
      exit_code: 0
      stdout_matches: "Usage:.*claude"
      max_duration_s: 5

  - id: claude-version-sane
    cmd: "claude --version"
    assert:
      exit_code: 0
      stdout_matches: "^[0-9]+\\.[0-9]+\\.[0-9]+"
      max_duration_s: 5

  - id: claude-runs-through-flox-agent
    cmd: "command -v claude"
    assert:
      exit_code: 0
      stdout_matches: "/claude/bin/claude$"
      max_duration_s: 5
