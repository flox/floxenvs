    "schema-version": "1.17.0",
    "description": "# Hugging Face Hub CLI\n\nAuthenticate (optional):\n\n```bash\nhf auth login\n```\n\nCreate a token at https://huggingface.co/settings/tokens.\n\nDownload a file:\n\n```bash\nhf download '<repo_id>' '<filename>'\n```\n\nInspect the cache:\n\n```bash\nhf cache scan\n```\n",
    "install": {
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "huggingface-hub": {
        "pkg-path": "flox/huggingface-hub",
        "pkg-group": "huggingface"
      }
    },
    "vars": {
      "HF_HOME": ""
    },
    "hook": {
      "on-activate": "HF_HOME=\"$FLOX_ENV_CACHE/huggingface\"\nexport HF_HOME\nmkdir -p \"$HF_HOME\"\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  if [[ \"${HF_XET_HIGH_PERFORMANCE:-0}\" == \"1\" ]]; then\n    perf_line=\"High-perf mode: ON (HF_XET_HIGH_PERFORMANCE=1)\"\n  else\n    perf_line=\"Faster transfers: export HF_XET_HIGH_PERFORMANCE=1\"\n  fi\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    \"Cache root: $HF_HOME\" \\\n    \"$perf_line\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
