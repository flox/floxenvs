    "schema-version": "1.17.0",
    "description": "# Node.js\n\nCommands:\n\n```text\nnpm install    Install packages\nnpm start      Run your app\nnode <file>    Run a script\n```\n",
    "install": {
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "nodejs": {
        "pkg-path": "nodejs_20",
        "pkg-group": "javascript-node"
      }
    },
    "vars": {
      "NODE_AUTO_INSTALL": "true",
      "NODE_ENV": "development"
    },
    "hook": {
      "on-activate": "export NODE_CACHE=\"$FLOX_ENV_CACHE/javascript-node\"\nmkdir -p \"$NODE_CACHE\"\n\n# Ensure npm cache is writable (HOME may be /var/empty\n# inside namespace isolation)\nexport npm_config_cache=\"$NODE_CACHE/npm-cache\"\n\nif [ \"$NODE_AUTO_INSTALL\" = \"true\" ] \\\n    && [ -f package.json ] \\\n    && [ -f package-lock.json ]; then\n  HASH=$(cat package.json package-lock.json \\\n    | sha256sum | cut -d\" \" -f1)\n  LAST=$(cat \"$NODE_CACHE/packages-hash\" 2>/dev/null)\n  if [ \"$HASH\" != \"$LAST\" ]; then\n    npm install\n    echo \"$HASH\" > \"$NODE_CACHE/packages-hash\"\n  fi\nfi\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    'Node.js environment ready!' '' \\\n    'Node version:' \\\n    \"  $(node --version)\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
