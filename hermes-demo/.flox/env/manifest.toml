schema-version = "1.17.0"

description = '''
# Hermes Agent — self-improving AI from Nous Research

First run:

```text
hermes setup     — interactive wizard
hermes model     — pick a provider/model
```

Talk to it:

```text
hermes           — terminal UI
hermes gateway   — Telegram/Discord/Slack
```
'''

[include]
environments = [
  { dir = "../hermes" }
]

# gum is a demo-only tool for styled terminal output.

[install]
gum.pkg-path  = "gum"
gum.pkg-group = "demo-tools"

[hook]
on-activate = '''
if [[ "${FLOX_ENVS_TESTING:-}" != "1" ]]; then
  gum style --border double --margin '1 2' \
    --padding '1 4' \
    "HERMES_HOME=$HERMES_HOME"
fi
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
