{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Hermes Agent — self-improving AI from Nous Research\n\nFirst run:\n\n```bash\nhermes setup  # interactive wizard\nhermes model  # pick a provider/model\n```\n\nTalk to it:\n\n```bash\nhermes          # terminal UI\nhermes gateway  # Telegram/Discord/Slack\n```\n",
    "install": {
      "ffmpeg": {
        "pkg-path": "ffmpeg",
        "pkg-group": "hermes"
      },
      "git": {
        "pkg-path": "git",
        "pkg-group": "hermes"
      },
      "gum": {
        "pkg-path": "gum",
        "pkg-group": "demo-tools"
      },
      "hermes-agent": {
        "pkg-path": "flox/hermes-agent",
        "pkg-group": "hermes"
      },
      "nodejs": {
        "pkg-path": "nodejs_22",
        "pkg-group": "hermes"
      },
      "ripgrep": {
        "pkg-path": "ripgrep",
        "pkg-group": "hermes"
      }
    },
    "vars": {
      "HERMES_HOME": ""
    },
    "hook": {
      "on-activate": "HERMES_HOME=\"$FLOX_ENV_CACHE/hermes\"\nexport HERMES_HOME\nmkdir -p \"$HERMES_HOME\"\n\n# Lazy-install backends (anthropic, exa, faster-whisper, ...)\n# would try to `pip install` into the read-only Nix venv and\n# fail. Seed the user config to disable them so the user\n# gets clean FeatureUnavailable errors instead of pip\n# tracebacks.\nconfig=\"$HERMES_HOME/config.yaml\"\nif [ ! -f \"$config\" ]; then\n  printf 'security:\\n  allow_lazy_installs: false\\n' \\\n    > \"$config\"\nfi\n\nif [[ \"${FLOX_ENVS_TESTING:-}\" != \"1\" ]]; then\n  gum style --border double --margin '1 2' \\\n    --padding '1 4' \\\n    \"HERMES_HOME=$HERMES_HOME\"\nfi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
