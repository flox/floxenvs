  "manifest": {
    "schema-version": "1.17.0",
    "description": "Hermes AI agent with persistent memory and messaging support.\n",
    "install": {
      "ffmpeg": {
        "pkg-path": "ffmpeg",
        "pkg-group": "hermes"
      },
      "git": {
        "pkg-path": "git",
