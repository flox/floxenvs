schema-version = "1.17.0"

description = '''
# iloom
AI-assisted dev in isolated worktrees

```text
il start <issue>   — start a loom for an issue
il finish          — validate, merge, clean up
il plan <issue>    — decompose an epic
il telemetry off   — disable anonymous usage data
```

```text
iloom uses gh for issue tracker auth:
  gh auth login
```
'''

[include]
environments = [
  { dir = "../iloom" }
]

# Inherit the 3-system constraint from the included iloom env.
[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
