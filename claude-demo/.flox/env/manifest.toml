schema-version = "1.17.0"

[include]
environments = [
  { dir = "../claude" }
]

[install]
gum.pkg-path = "gum"
gum.pkg-group = "demo-tools"
agent-plugin-claude-md-management.pkg-path = "agent-stacks/agent-plugin-claude-md-management"
agent-plugin-claude-md-management.pkg-group = "agent-plugin-claude-md-management"

[hook]
on-activate = '''
if [ "${FLOX_ENVS_TESTING:-}" != "1" ]; then
  gum style \
    --foreground 212 --border-foreground 212 \
    --border double --align center \
    --width 50 --margin "1 2" --padding "1 2" \
    "Claude Code" "with the environment's agent plugins"
  echo ""
  echo "  claude              — start Claude Code"
  echo "  claude plugin list  — show the loaded plugins"
  echo "  flox-agent list     — show the stack's plugins"
  echo ""
fi
'''
