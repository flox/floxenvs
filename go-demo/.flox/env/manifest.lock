  "manifest": {
    "schema-version": "1.17.0",
    "description": "# Go development environment\n\nIncluded tools:\n\n```text\ngo        - compiler and tools\ngopls     - language server\ngotools   - standard tools (goimports, etc.)\ngo-task   - task runner\ngore      - REPL\n```\n\nTry the sample app:\n\n```bash\ngo build && ./hello\n```\n",
    "install": {
      "clang": {
        "pkg-path": "clang"
      },
      "go": {
        "pkg-path": "go"
      },
      "go-task": {
        "pkg-path": "go-task",
        "pkg-group": "go-tools"
      },
      "gomodifytags": {
        "pkg-path": "gomodifytags",
        "pkg-group": "go-tools"
      },
      "gopls": {
        "pkg-path": "gopls",
        "pkg-group": "go-tools",
        "priority": 4
      },
      "gore": {
        "pkg-path": "gore",
        "pkg-group": "go-tools"
      },
      "gotests": {
        "pkg-path": "gotests",
        "pkg-group": "go-tools"
      },
      "gotools": {
        "pkg-path": "gotools",
        "pkg-group": "go-tools"
      },
      "libresolv": {
        "pkg-path": "darwin.libresolv",
        "systems": [
          "aarch64-darwin"
        ]
      }
    },
    "hook": {
      "on-activate": "export GOENV=\"$FLOX_ENV_CACHE/go\"\nexport GOMODCACHE=\"$FLOX_ENV_CACHE/go/pkg/mod\"\n\n# cgo defaults to \"gcc\" on Linux and \"clang\" on macOS. This environment\n# provides clang on every system, so point cgo at it unless the user has\n# already chosen a compiler.\nexport CC=\"${CC:-clang}\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
